<svg xmlns="http://www.w3.org/2000/svg" width="360" height="44" viewBox="0 0 360 44" role="img" aria-label="Show us the work you still do by hand">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:600}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
</style>
<rect x=".5" y=".5" width="359" height="43" rx="22" fill="#161b22" stroke="#30363d"/>
<circle class="ring" cx="24" cy="22" r="5" fill="#fbbf24"/>
<circle cx="24" cy="22" r="5" fill="#fbbf24"/>
<text x="40" y="27" fill="#e6edf3">Show us the work you still do by hand →</text>
</svg>
