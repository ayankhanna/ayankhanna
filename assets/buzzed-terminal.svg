<g class="l15"><text x="24" y="410.3"><tspan fill="#fbbf24">  ▸ </tspan><tspan fill="#6e7681">people it touches</tspan></text><rect x="209.9" y="399.3" width="300" height="10" rx="2" fill="#21262d"/><rect class="l15b" x="209.9" y="399.3" width="234.0" height="10" rx="2" fill="#fbbf24"/><text x="523.9" y="410.3" fill="#c9d1d9" font-weight="700">5M+</text></g>
