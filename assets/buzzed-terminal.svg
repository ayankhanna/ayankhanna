<g class="l18"><text x="24" y="476.3"><tspan fill="#fbbf24">  ▸ </tspan><tspan fill="#6e7681">people it touches</tspan></text><rect x="209.9" y="465.3" width="300" height="10" rx="2" fill="#21262d"/><rect class="l18b" x="209.9" y="465.3" width="234.0" height="10" rx="2" fill="#fbbf24"/><text x="523.9" y="476.3" fill="#c9d1d9" font-weight="700">5M+</text></g>
<g class="l19"><text x="24" y="510.4"><tspan fill="#fbbf24">ayan</tspan><tspan fill="#6e7681">@</tspan><tspan fill="#fbbf24">buzzed</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#6e7681">% </tspan><tspan fill="#c9d1d9">buzzed log --wins</tspan></text>
