<text class="l3" x="24" y="110.0"><tspan fill="#6e7681">prev: </tspan><tspan fill="#c9d1d9">product @ Saturn</tspan><tspan fill="#6e7681">  ➜  </tspan><tspan fill="#fffc00">acquired by Snap</tspan></text>
<g class="l4"><text x="24" y="144.1"><tspan fill="#fbbf24">ayan</tspan><tspan fill="#6e7681">@</tspan><tspan fill="#fbbf24">buzzed</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#6e7681">% </tspan><tspan fill="#c9d1d9">cat ~/buzzed/README</tspan></text>
