<text class="l5" x="24" y="166.1"><tspan fill="#fbbf24">  SaaS, but built for you.</tspan></text>
<text class="l6" x="24" y="188.1"><tspan fill="#6e7681">  Every company gets its own software, automations baked in. We run it.</tspan></text>
<g class="l7"><text x="24" y="222.2"><tspan fill="#fbbf24">ayan</tspan><tspan fill="#6e7681">@</tspan><tspan fill="#fbbf24">buzzed</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#6e7681">% </tspan><tspan fill="#c9d1d9">git diff your-company/before your-company/after</tspan></text>
<g class="l7t"><rect class="l7k" x="159.2" y="206.2" width="860" height="22" fill="#0b0e14"/><rect class="l7c" x="159.2" y="209.2" width="8.4" height="17" fill="#fbbf24"/></g></g>
<text class="l8" x="24" y="244.2"><tspan fill="#ff7b72">- </tspan><tspan fill="#ff7b72">bending your workflow around six SaaS tools</tspan></text>
<text class="l9" x="24" y="266.2"><tspan fill="#3fb950">+ </tspan><tspan fill="#3fb950">one system built around how you actually work</tspan></text>
<text class="l10" x="24" y="288.2"><tspan fill="#ff7b72">- </tspan><tspan fill="#ff7b72">your team copy-pasting between tabs all day</tspan></text>
<text class="l11" x="24" y="310.2"><tspan fill="#3fb950">+ </tspan><tspan fill="#3fb950">an agent does it. a human signs off on the edge cases.</tspan></text>
<text class="l12" x="24" y="332.2"><tspan fill="#ff7b72">- </tspan><tspan fill="#ff7b72">&quot;we&#x27;ll get to it next quarter&quot;</tspan></text>
<text class="l13" x="24" y="354.2"><tspan fill="#3fb950">+ </tspan><tspan fill="#3fb950">in production in 3 weeks</tspan></text>
