<text class="l2" x="24" y="88.0"><tspan fill="#c9d1d9">Ayan Khanna</tspan><tspan fill="#6e7681"> — co-founder @ </tspan><tspan fill="#fbbf24">Buzzed</tspan><tspan fill="#6e7681">  (NYC)</tspan></text>
<g class="l3"><text x="24" y="122.1"><tspan fill="#fbbf24">ayan</tspan><tspan fill="#6e7681">@</tspan><tspan fill="#fbbf24">buzzed</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#6e7681">% </tspan><tspan fill="#c9d1d9">cat ~/buzzed/thesis.md</tspan></text>
