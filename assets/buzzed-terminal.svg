<text class="l17" x="24" y="466.4"><tspan fill="#b392f0">northwestern/</tspan><tspan fill="#c9d1d9">    </tspan><tspan fill="#58a6ff">saturn/</tspan><tspan fill="#c9d1d9">    </tspan><tspan fill="#ff7b72">4am-deploys/</tspan></text>
