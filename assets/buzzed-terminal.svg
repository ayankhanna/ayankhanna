<text class="l4" x="24" y="144.1"><tspan fill="#6e7681">  Agencies sell hours. SaaS sells seats.</tspan></text>
<text class="l5" x="24" y="166.1"><tspan fill="#3fb950">  We ship AI systems you own.</tspan></text>
<g class="l6"><text x="24" y="200.2"><tspan fill="#fbbf24">ayan</tspan><tspan fill="#6e7681">@</tspan><tspan fill="#fbbf24">buzzed</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#6e7681">% </tspan><tspan fill="#c9d1d9">buzzed --help</tspan></text>
<g class="l6t"><rect x="159.2" y="184.2" width="860" height="22" fill="#0b0e14"/><rect class="l6c" x="159.2" y="187.2" width="8.4" height="17" fill="#fbbf24"/></g></g>
<text class="l7" x="24" y="222.2"><tspan fill="#6e7681">  what   </tspan><tspan fill="#c9d1d9">forward-deployed AI engineers for the real economy</tspan></text>
<text class="l8" x="24" y="244.2"><tspan fill="#6e7681">  how    </tspan><tspan fill="#c9d1d9">embed with your team, find the work done by hand,</tspan></text>
<text class="l9" x="24" y="266.2"><tspan fill="#6e7681">         </tspan><tspan fill="#c9d1d9">replace it with software that runs in production</tspan></text>
<text class="l10" x="24" y="288.2"><tspan fill="#6e7681">  you    </tspan><tspan fill="#c9d1d9">own the code. no seats. no lock-in. no retainer.</tspan></text>
<g class="l11"><text x="24" y="322.3"><tspan fill="#fbbf24">ayan</tspan><tspan fill="#6e7681">@</tspan><tspan fill="#fbbf24">buzzed</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#6e7681">% </tspan><tspan fill="#c9d1d9">buzzed status --prod</tspan></text>
<g class="l11t"><rect x="159.2" y="306.3" width="860" height="22" fill="#0b0e14"/><rect class="l11c" x="159.2" y="309.3" width="8.4" height="17" fill="#fbbf24"/></g></g>
<g class="l12"><text x="24" y="344.3"><tspan fill="#fbbf24">  ▸ </tspan><tspan fill="#6e7681">systems in prod</tspan></text><rect x="209.9" y="333.3" width="300" height="10" rx="2" fill="#21262d"/><rect class="l12b" x="209.9" y="333.3" width="300.0" height="10" rx="2" fill="#fbbf24"/><text x="523.9" y="344.3" fill="#c9d1d9" font-weight="700">80+</text></g>
